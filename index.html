<style>

  @font-face{font-family:PkmnEmn;src:url(assets/fonts/pkmnemn.ttf)}
  html,body{margin:0;height:100%;background:#000 center/cover no-repeat;overflow:hidden;font-family:sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;width:min(100vw,calc(100vh*4/3));height:min(75vw,100vh);outline:none}
  #nameBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:5}
  #nameBox .card{background:#fff;border:4px solid #405070;border-radius:12px;padding:20px 24px;min-width:280px;text-align:center;font:600 20px/1.3 "Trebuchet MS",sans-serif;color:#202830}
  #nameBox input{margin-top:12px;font:600 22px "Trebuchet MS",sans-serif;padding:6px 10px;border:2px solid #405070;border-radius:6px;width:80%;text-align:center}
  #nameBox button{margin-top:14px;font:600 18px "Trebuchet MS",sans-serif;padding:6px 22px;border-radius:6px;border:2px solid #405070;background:#e8eef8;cursor:pointer}
  #hint{position:fixed;left:8px;bottom:6px;color:#9ab;font:12px sans-serif;opacity:.7;pointer-events:none}
